services:
  db:
    image: postgis/postgis:16-3.4
    container_name: meteo-db
    environment:
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: meteo
      POSTGRES_DB: meteo
    ports:
      - "5432:5432"
    volumes:
      - meteo-pgdata:/var/lib/postgresql/data
    networks:
      - meteo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meteo -d meteo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Batch/CLI app. Kept under the "app" profile so `docker compose up -d`
  # starts only the DB; run tasks on demand, e.g.
  #   docker compose run --rm app npm run seed
  #   docker compose run --rm app npm run daily
  #   docker compose run --rm -e DB_INIT=1 -e DB_SEED=1 app npm run daily
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meteo-aggregator:local
    container_name: meteo-app
    profiles: ["app"]
    env_file:
      - .env
    environment:
      # Override the .env host: inside the compose network the DB is `db`.
      DATABASE_URL: postgresql://meteo:meteo@db:5432/meteo?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meteo-net
    volumes:
      - ./logs:/app/logs

  # Read API. Reuses the batch image (same src/, node_modules and generated
  # Prisma client), so no Dockerfile change is needed. Deliberately outside the
  # "app" profile: `docker compose up -d` brings up db + api, while batch tasks
  # stay on demand.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meteo-aggregator:local
    container_name: meteo-api
    command: npm run api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meteo:meteo@db:5432/meteo?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meteo-net
    volumes:
      - ./logs:/app/logs

  # Map front end (Vite + React + Leaflet), built to static assets and served by
  # nginx, which also proxies /api/* to the `api` service (see web/nginx.conf).
  # Like `api`, it comes up with `docker compose up -d`. Open http://localhost:8080.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: meteo-aggregator-web:local
    container_name: meteo-web
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - meteo-net

volumes:
  meteo-pgdata:

networks:
  meteo-net:
    driver: bridge
