server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve index.html for any unknown path so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the Fastify service on the compose network, stripping the
  # /api prefix (mirrors the Vite dev proxy rewrite): /api/towns -> /towns.
  #
  # The upstream is resolved at request time via Docker's embedded DNS
  # (127.0.0.11) instead of at startup, so nginx boots even when `api` is
  # temporarily down and picks it up once it is healthy.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
